name: arrivo
description: Arrivo - a geofence arrival alarm for commuters. Never miss your stop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  flutter_background_service: ^5.0.8
  flutter_ringtone_player: ^4.0.0+3
  audioplayers: ^6.0.0
  vibration: ^2.0.0
  wakelock_plus: ^1.2.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/arrivo_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/arrivo_icon.png"
  adaptive_icon_background: "#08CDB3"
  adaptive_icon_foreground: "assets/icon/arrivo_pin_foreground.png"
